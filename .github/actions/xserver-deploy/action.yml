name: XSERVER Deploy
description: Deploy to XSERVER via rsync

inputs:
  action:
    description: "make command to run (check, diff, dry-push, push)"
    required: true
    default: "push"
  ssh_host:
    description: "SSH host"
    required: true
  ssh_port:
    description: "SSH port"
    required: true
  ssh_user:
    description: "SSH user"
    required: true
  ssh_key:
    description: "SSH private key"
    required: true
  deploy_path:
    description: "Remote deploy path"
    required: true

runs:
  using: composite
  steps:
    - name: Setup SSH
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ inputs.ssh_key }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -p ${{ inputs.ssh_port }} -H ${{ inputs.ssh_host }} >> ~/.ssh/known_hosts

    - name: Check diff
      id: diff
      if: inputs.action == 'push'
      shell: bash
      run: |
        output=$(make diff 2>&1) || true
        echo "$output"
        if echo "$output" | grep -qE "^[<>cf]"; then
          echo "has_diff=true" >> $GITHUB_OUTPUT
        else
          echo "has_diff=false" >> $GITHUB_OUTPUT
          echo "No changes to deploy"
        fi
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_PORT: ${{ inputs.ssh_port }}
        SSH_USER: ${{ inputs.ssh_user }}
        DEPLOY_PATH: ${{ inputs.deploy_path }}

    - name: Run make
      if: inputs.action != 'push' || steps.diff.outputs.has_diff == 'true'
      shell: bash
      run: make ${{ inputs.action }}
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_PORT: ${{ inputs.ssh_port }}
        SSH_USER: ${{ inputs.ssh_user }}
        DEPLOY_PATH: ${{ inputs.deploy_path }}

    - name: Skip (no changes)
      if: inputs.action == 'push' && steps.diff.outputs.has_diff == 'false'
      shell: bash
      run: echo "No changes to deploy. Skipping push."
