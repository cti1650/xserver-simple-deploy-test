name: XSERVER Deploy
description: Deploy to XSERVER via rsync

inputs:
  action:
    description: "make command to run (check, diff, dry-push, push)"
    required: true
    default: "push"
  ssh_host:
    description: "SSH host"
    required: true
  ssh_port:
    description: "SSH port"
    required: true
  ssh_user:
    description: "SSH user"
    required: true
  ssh_key:
    description: "SSH private key"
    required: true
  deploy_path:
    description: "Remote deploy path"
    required: true
  slack_webhook_url:
    description: "Slack webhook URL (optional)"
    required: false
    default: ""
  service_name:
    description: "Service name for notification (optional)"
    required: false
    default: ""
  deploy_url:
    description: "Deployed site URL for notification (optional)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup SSH
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ inputs.ssh_key }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -p ${{ inputs.ssh_port }} -H ${{ inputs.ssh_host }} >> ~/.ssh/known_hosts

    - name: Check diff
      id: diff
      if: inputs.action == 'push'
      shell: bash
      run: |
        output=$(make diff 2>&1) || true
        echo "$output"
        if echo "$output" | grep -qE "^[<>cf]"; then
          echo "has_diff=true" >> $GITHUB_OUTPUT
        else
          echo "has_diff=false" >> $GITHUB_OUTPUT
          echo "No changes to deploy"
        fi
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_PORT: ${{ inputs.ssh_port }}
        SSH_USER: ${{ inputs.ssh_user }}
        DEPLOY_PATH: ${{ inputs.deploy_path }}

    - name: Run make
      if: inputs.action != 'push' || steps.diff.outputs.has_diff == 'true'
      shell: bash
      run: make ${{ inputs.action }}
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_PORT: ${{ inputs.ssh_port }}
        SSH_USER: ${{ inputs.ssh_user }}
        DEPLOY_PATH: ${{ inputs.deploy_path }}

    - name: Skip (no changes)
      if: inputs.action == 'push' && steps.diff.outputs.has_diff == 'false'
      shell: bash
      run: echo "No changes to deploy. Skipping push."

    - name: Notify Slack (success)
      if: success() && inputs.slack_webhook_url != '' && inputs.action == 'push' && steps.diff.outputs.has_diff == 'true'
      shell: bash
      run: |
        SERVICE="${{ inputs.service_name }}"
        URL="${{ inputs.deploy_url }}"

        if [ -n "$SERVICE" ] && [ -n "$URL" ]; then
          MSG="✅ *${SERVICE}* へのデプロイが完了しました\n<${URL}|サイトを確認>"
        elif [ -n "$SERVICE" ]; then
          MSG="✅ *${SERVICE}* へのデプロイが完了しました"
        elif [ -n "$URL" ]; then
          MSG="✅ デプロイが完了しました\n<${URL}|サイトを確認>"
        else
          MSG="✅ デプロイが完了しました"
        fi

        curl -s -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"${MSG}\"}" \
          "${{ inputs.slack_webhook_url }}"

    - name: Notify Slack (failure)
      if: failure() && inputs.slack_webhook_url != ''
      shell: bash
      run: |
        SERVICE="${{ inputs.service_name }}"

        if [ -n "$SERVICE" ]; then
          MSG="❌ *${SERVICE}* のデプロイに失敗しました"
        else
          MSG="❌ デプロイに失敗しました"
        fi

        curl -s -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"${MSG}\"}" \
          "${{ inputs.slack_webhook_url }}"
